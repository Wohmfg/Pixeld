{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pixle{% endblock %}</title>
  <script>
    // Tell the server the browser's timezone so "today's puzzle" flips at local midnight.
    // If the cookie was missing or stale, reload once so this page uses the right day.
    (function () {
      try {
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (!tz) return;
        var match = document.cookie.match(/(?:^|; )tz=([^;]*)/);
        if (match && match[1] === tz) return;
        document.cookie = 'tz=' + tz + '; path=/; max-age=31536000; SameSite=Lax';
        // Only reload if the cookie actually stuck (avoids a loop when cookies are blocked)
        if (document.cookie.indexOf('tz=' + tz) !== -1) location.reload();
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="header-inner">
      <h1><a href="/" aria-label="Pixle">P<svg class="logo-i" viewBox="0 0 10 40" width="10" height="40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="0" y="0"  width="10" height="10" fill="#ED254E"/><rect x="0" y="20" width="10" height="10" fill="#DDA448"/><rect x="0" y="30" width="10" height="10" fill="#7A82AB"/></svg>xle</a></h1>
      <div id="streak-badge" class="streak-badge" hidden>
        🔥 <span id="streak-count">0</span>
      </div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
